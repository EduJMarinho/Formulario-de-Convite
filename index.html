<!DOCTYPE html>
<html lang="pt-br">
<head>     

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <title>Formulário de Convite</title>
  
  <link rel="stylesheet" href="styles/index.css">

</head>
<body>
  <div id="app">
    
    <aside>
      <div class="aside-container">

        <img class="Bolo" src="assets/imagens/Background.svg" alt="festivite">
        
        <header class="capa">        
        <img class="festa" src="assets/imagens/Logo.svg" alt="festa">
        <p class="logo">Festivite</p>  
        <p class="crie">Crie um convite digital para o seu evento</p>
        </header> 
      </div>
    </aside>

    <main>
      <h1>Crie seu convite</h1>

      <form method="post" enctype="multipart/form-data">

      <div class="main-container">
        
          <section class="section-one">

          <div class="sobre">
            <img src="assets/icons/sobre.svg" alt="">
            <h2>Sobre o evento</h2>
          </div>

         <fieldset class="one-section">
                
                <div class="evento">
                <label for="evento">Título</label>
                <input 
                id="evento"
                name="evento"
                type="text"
                placeholder="Nome do Evento">                 
              </div>

                <div class="inicio">
                <label for="inicio">Início</label>
                <input 
                id="inicio"
                name="inicio"
                type="text"
                lang="pt-br"              
                placeholder="DD/MM/AAAA, --:--">                
                </div>

                <div class="fim">
                <label for="fim">Fim</label>
                <input 
                id="fim"
                name="fim"
                type="text"
                lang="pt-br"
                placeholder="DD/MM/AAAA, --:--">
                </div>                    

                <div class="actions-wrapper">
                <label for="tipo">Tipo</label>                

                <div class="check" >
                  
                <input type="checkbox" id="chk">
                <label for="chk" class="switch">

                  <span class="slider"></span>

                  <div class="model-personal">
                  <img class="img-check-impress" 
                  src="assets/icons/building-2.svg" alt="icone de impressora">              
                  <label class="text-check" for="person">Presencial</label>                  
                  <img 
                  class="img-check-video"
                  src="assets/icons/video.svg" alt="icone de impressora">                  
                  <label class="text-check" for="online">Online</label>
                  </div>                  
                  </div>
                </label>                           
                </div>                        

                <div class="local">
                <label for="local">Local</label>
                <input 
                id="local"
                name="local"
                type="text"
                placeholder="Link ou endereço">
                </div>  
                
                <div class="descricao">
                <label for="descricao">Descrição</label >
                <textarea name="descricao" id="descricao" rows="5"                 
                placeholder="Escreva sobre os detalhes do evento">
                </textarea>                
                </div> 

                                        
        </section>

        <section class="section-two">
                    
            <div class="personal">
            <img src="assets/icons/paintbrush-vertical.svg" alt="icone de pincel">
            <h2>Personalização</h2>
            </div>

            <div class="paleta-cor">
            <label for="texto">Cor principal</label>   
            
            
            <div class="container-balls">   
        
            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch"></span> 
            </div>
            </label>   
        
            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch2"></span> 
            </div>
            </label>  
        
        
            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch3"></span> 
            </div>
            </label>  
        
            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch4"></span> 
            </div>
            </label>  
        
            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch5"></span> 
            </div>
            </label>  
        
            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch6"></span> 
            </div>
            </label>  
        
            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch7"></span> 
            </div>
            </label>  
        
            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch8"></span> 
            </div>
            </label>  

            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch9"></span> 
            </div>
            </label>  
        
            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch10"></span> 
            </div>
            </label>  
        
            <label class="switch2">
            <span class="switch-text"></span>
            <div class="switch-wrapper">
            <input type="checkbox" class="ball-one" name="ball-one"> 
            <span class="switch-button"></span>  
            <span id="button-switch11"></span> 
            </div>
            </label>  
            </div>  </div>  

            <div class="subject">
            <label for="texto">Tema do evento</label>
             </div>

            <div class="container-cards"> 

           <div class="div-card">   
            <input type="checkbox" id="ibirthday" name="birthday">         
           <label for="ibirthday" class="label-card">                           
           <img class="img-cards" src="assets/imagens/Niver.svg" alt="niver">  
           <p>Aniversário</p>   
           </label>       
           </div>   
              
           <div class="div-card">   
            <input type="checkbox" id="ichild" name="child">         
           <label for="ichild" class="label-card">                           
           <img class="img-cards" src="assets/imagens/infantil.svg" alt="Infantil">  
           <p>Infantil</p>   
           </label>       
           </div>              
           
           <div class="div-card">   
            <input type="checkbox" id="igraduation" name="graduation">         
           <label for="igraduation" class="label-card">                           
           <img class="img-cards" src="assets/imagens/formatura.svg" alt="formatura">  
           <p>formatura</p>   
           </label>       
           </div>              
           
           <div class="div-card">   
            <input type="checkbox" id="imarriage" name="marriage">         
           <label for="imarriage" class="label-card">                           
           <img class="img-cards" src="assets/imagens/casamento.svg" alt="casamento">  
           <p>casamento</p>   
           </label>       
           </div>                       

           <div class="div-card">   
            <input type="checkbox" id="ibaby" name="baby">         
           <label for="ibaby" class="label-card">                           
           <img class="img-cards" src="assets/imagens/bebe.svg" alt="Chá de bebê">  
           <p>Chá de bebê</p>   
           </label>       
           </div>      
           
           <div class="div-card">   
            <input type="checkbox" id="ipanela" name="graduation">         
           <label for="ipanela" class="label-card">                           
           <img class="img-cards" src="assets/imagens/panela.svg" alt="panela">  
           <p>Chá de panela</p>   
           </label>       
           </div>              
                      
           <div class="div-card">   
            <input type="checkbox" id="icarnaval" name="graduation">         
           <label for="icarnaval" class="label-card">                           
           <img class="img-cards" src="assets/imagens/carnaval.svg" alt="carnaval">  
           <p>Carnaval</p>   
           </label>       
           </div>              
           
            <div class="div-card">   
            <input type="checkbox" id="ipascoa" name="pascoa">         
           <label for="ipascoa" class="label-card">                           
           <img class="img-cards" src="assets/imagens/pascoa.svg" alt="pascoa">  
           <p>Páscoa</p>   
           </label>       
           </div> 

           <div class="div-card">   
            <input type="checkbox" id="ijohn" name="john">         
           <label for="ijohn" class="label-card">                           
           <img class="img-cards" src="assets/imagens/joao.svg" alt="john">  
           <p>São João</p>   
           </label>       
           </div>              
          
           <div class="div-card">   
            <input type="checkbox" id="ihalloween" name="graduation">         
           <label for="ihalloween" class="label-card">                           
           <img class="img-cards" src="assets/imagens/halloween.svg" alt="halloween">  
           <p>Halloween</p>   
           </label>       
           </div>              
           
           
           
           <div class="div-card">   
            <input type="checkbox" id="inatal" name="natal">         
           <label for="inatal" class="label-card">                           
           <img class="img-cards" src="assets/imagens/natal.svg" alt="natal">  
           <p>Natal</p>   
           </label>       
           </div>              
           
           <div class="div-card">   
            <input type="checkbox" id="ioutros" name="outros">         
           <label for="ioutros" class="label-card">                           
           <img class="img-cards" src="assets/imagens/outro.svg" alt="outros">  
           <p>Outros</p>   
           </label>       
           </div>         
           

            </div>            

        <div class="switch-toggle">

          <div class="style">
            <label for="texto">Estilo</label>
    <div class="space">
          <label 
         for="my-switch" class="l-switch">           
            <div class="wrapper-switch" >
                <input type="checkbox" id="my-switch" name="my-switch">              
              <span class="button-switch" ></span> 
            <span class="dark" >Escuro</span>
            <span class="clean" >Claro</span>
            </div>

          </label>
    </div>
          </div>

          <div class="file-input">
            <label for="file-input">Foto de capa

              <div class="wrapper-part">
            <div class="wrapper-file">
              <img src="assets/icons/select.svg" alt="selecionar">
              <label for="file-input" class="text-select">Selecionar</label>
              <input type="checkbox" id="file-input" name="file-input">             
              <span class="select">Nenhum arquivo selecionado</span>
              <span class="no-select">img.png</span>                     
            </div>

          </div>   

          </section>

  <section class="section-three">
  
    <div class="date">
      
            <img src="assets/icons/data.svg" alt="dados">
            <h2>Dados para contato</h2>
          </div>

         <fieldset class="three-section">
                
                <div class="name">
                <label for="name" >Nome</label>
                <input disabled
                id="name"
                name="name"
                type="text"
                placeholder="Nome completo">                 
              </div>

              <section class="alert">            
                  <img src="assets/icons/circle-alert.svg" alt="alerta">
                  <p>Campo Obrigatório</p>              
              </section>              

                <div class="e-mail">
                <label for="e-mail">E-mail</label>
                <input 
                id="e-mail"
                name="e-mail"
                type="text"
                lang="pt-br"              
                placeholder="exemplo@email.com">                
                </div>

                <div class="fone">
                <label for="fone">Telefone</label>
                <input 
                id="fone"
                name="fone"
                type="text"
                lang="pt-br"
                placeholder="(99) 99999-9999 ">
                </div>               
    
  </fieldset>
  </section>        

  <section class="section-four">

    <footer>

      <div class="wrapper-footer">

      <div class="div-footer">        
        <div class="div-slide">
    <input type="checkbox" name="privacy" id="privacy">    
    <label for="privacy" class="slide-label"></label>
     </div>
     <div class="div-text">
    <label for="privacy" >Li e concordo com os <span>Termos e Condições</span>
      e com a <span>Política de Privacidade</span>
      </label>   
    </div>     
    </div>

    <div class="div-footer">         
        <div class="div-slide">
    <input type="checkbox" name="privacy" id="accepted">    
    <label for="accepted" class="slide-label"></label>
     </div>
     <div class="div-text">
    <label for="accepted" >Aceito receber atualizações por e-mail
      </label>   
    </div>      </div>  

    <div class="div-footer">         
        <div class="div-slide">
    <input type="checkbox" name="privacy" id="update">    
    <label for="update" class="slide-label"></label>
     </div>
     <div class="div-text">
    <label for="update" >Aceito receber atualizações por SMS
      </label>   
    </div>     
  </div>  
  </div>

  <div class="action-wrapper">  

    <div class="backg">
  <div class="button-action">
    <img src="assets/icons/action.svg" alt="">
    <input type="file" name="action" id="action">
    <label for="action">
    <label>Gerar convite</label>
    </label>
  </div>
  </div>

</div>

  </footer>

  </section>

      </div>
      </form>
    </main>

    </div>
  </div>  
</body>
</html>
