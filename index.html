<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <title>Formulário de Convite</title>

  <link rel="stylesheet" href="styles/index.css">

</head>
<body>
  
 <div id="app">
     
    <aside>
      <div class="aside-container">
        <img src="assets/imagens/Background.svg" alt="festivite">

        <header class="capa" >        
        <img class="festa" src="assets/imagens/Logo.svg" alt="logo">
        <p class="logo">Festivite</p>  
        <p class="crie">Crie um convite digital para o seu evento</p>
        </header>
      </div>
    </aside>

    <main>       

      <div class="main-container">
        <p class="convite">Crie seu convite</p>

        <section class="part-one">
          <div class="sobre">
          <img src="assets/icons/sobre.svg" alt="sobre o evento">
          <p>Sobre o evento</p>     
          </div>

            <form method="post" enctype="multipart/form-data">

              <fieldset class="one-section">
                
                <div class="evento">
                <label for="evento">Título</label>
                <input 
                id="evento"
                name="evento"
                type="text"
                placeholder="Nome do Evento">
                </div>

                <div class="inicio">
                <label for="inicio">Início</label>
                <input 
                id="inicio"
                name="inicio"
                type="text"
                lang="pt-br"
                placeholder="DD/MM/AAAA, --:--">
                </div>

                <div class="fim">
                <label for="fim">Fim</label>
                <input 
                id="fim"
                name="fim"
                type="text"
                lang="pt-br"
                placeholder="DD/MM/AAAA, --:--">
                </div>







                


                <div class="local">
                <label for="local">Local</label>
                <input 
                id="local"
                name="local"
                type="text"
                placeholder="Link ou endereço">
                </div>  
                
                <div class="descricao">
                  <label for="descricao">Descrição</label>
                  <textarea name="descricao" id="descricao"
                  rows="8"
                  placeholder="Escreva sobre os detalhes do evento">
                  </textarea>
                </div>

                
                </div>  
              </fieldset>

            </form>          
        </section>


      </div>
      
      </main>

  </div>

</body>
</html>
